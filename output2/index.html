<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Grades Portal · Log In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="portal-wrapper">
    <!-- decorative academic header -->
    <div class="portal-header">
      <div class="header-icon" aria-hidden="true">📚</div>
      <h1>Grades Portal</h1>
      <p class="subhead">Enter your credentials to access your academic records</p>
    </div>

    <!-- login form – no JavaScript, pure HTML/CSS -->
    <form action="#" method="post" class="login-form">
      <!-- username / student ID field -->
      <div class="input-group">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" 
               placeholder="e.g., j.smith2025@edu.ph.com" 
               required>
      </div>

      <!-- password field -->
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" 
               placeholder="············" 
               required>
      </div>

      <!-- optional role selector (no js, just visual preference) -->
      <div class="role-selector">
        <span class="role-label">I am a:</span>
        <div class="role-options">
          <label class="role-option">
            <input type="radio" name="userRole" value="student" checked>
            <span class="radio-custom">Student</span>
          </label>
          <label class="role-option">
            <input type="radio" name="userRole" value="parent">
            <span class="radio-custom">Parent</span>
          </label>
          <label class="role-option">
            <input type="radio" name="userRole" value="teacher">
            <span class="radio-custom">Teacher</span>
          </label>
        </div>
      </div>

      <!-- login button -->
      <button type="submit" class="login-btn">Log in to portal</button>

      <!-- sign-up callout + extra links -->
      <div class="signup-prompt">
        <span class="prompt-text">Don't have an account?</span>
        <a href="signup.html" class="signup-btn">Sign up</a>
      </div>

    </form>

    <!-- footer with school year -->
    <div class="portal-footer">
      <p>Kanto Buan High School · 2025-2026</p>
    </div>
  </div>
</body>
</html>
